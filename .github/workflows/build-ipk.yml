name: Build webOS IPK - v1.0.8 Build 9
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test legacy JavaScript
        run: |
          node --check service/service.js
          node --check service/renewal.js
          node --check app/main.js
          node tests/smoke.js
      - name: Install official LG webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6
      - name: Configure TV profile
        run: ares-config --profile tv
      - name: Generate real PNG app icon
        run: |
          python -m pip install --user Pillow
          python tools/make_icon.py
          file app/icon.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('app/icon.png')
          assert im.size==(130,130) and im.format=='PNG'
          print('Valid LG menu icon:', im.size, im.format)
          PY
      - name: Package with official ares-package
        run: |
          mkdir -p dist
          ares-package --no-minify app service -o dist
          test -n "$(find dist -maxdepth 1 -name '*.ipk' -print -quit)"
          ares-package -i "$(find dist -maxdepth 1 -name '*.ipk' | head -1)"
      - name: Upload installable IPK
        uses: actions/upload-artifact@v4
        with:
          name: DevModeKeeper-webOS2-v1.0.8-build9-BETA-IPK
          path: dist/*.ipk
          if-no-files-found: error